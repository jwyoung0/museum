<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>Artwork Detail - Visitor</title>
    <link rel="stylesheet" href="/style">
    <style>
        .membership-benefits {
            border-left: 1px solid #ddd;
            padding-left: 1.5rem;
        }

        .membership-benefits ul {
            margin: 0;
            padding-left: 1.25rem;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <h1 class="site-title"><a href="/">MFAH</a></h1>
        <nav class="header-nav" aria-label="Main navigation">
            <a href="/artwork" aria-current="page">Artwork</a>
            <a href="/membership">Membership</a>
            <!-- <a href="/events">Events</a> -->
            <a href="/ticketing">Tickets</a>
            <a href="/shop">Shop</a>
        </nav>
    
        <!-- VISITOR_AUTH -->

    </header>

    <main>
        <h2>Membership Tier Details</h2>
        <section class="artwork-detail-workspace">
        <a href="/membership">
            ← Back to Membership Tiers
        </a>
            <header class="workspace-header">
                <h2 id="TierName-Header">Loading...</h2>
            </header>
        <div class="artwork-detail-content">
            <dl class="artwork-detail-grid">
                <dt>Tier Name</dt>
                <dd id="TierName"></dd>

                <dt>Tier Price</dt>
                <dd id="Price"></dd>

                <dt>Description</dt>
                <dd id="Description"></dd>           
            </dl>
            
            <div class="membership-benefits">
                <h3>Benefits</h3>
                <ul id="Benefits"></ul>
            </div>
        </div>        
            
            <div id="detail-error" hidden>
                Unable to load membership tier.
            </div>

            <button id="continue-button" class="button-primary">
                Continue to Checkout
            </button>

        </section>
        
    </main>
    <script src="/js/membership-detail.js"></script>
</body>
</html>
