<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>MFAH Portal</title>
    <link rel="stylesheet" href="/style">
</head>
<body>
    <header class="site-header">
        <h1 class="site-title"><a href="/">MFAH</a></h1>
        <nav class="header-nav" aria-label="Main navigation">
            <a href="/artwork" aria-current="page">Artwork</a>
            <a href="/membership">Membership</a>
            <a href="/events">Events</a>
            <a href="/ticketing">Tickets</a>
            <a href="/shop">Shop</a>
        </nav>
    
        <!-- VISITOR_AUTH -->

    </header>
    <main>
        <nav aria-label="Artwork navigation">
            <a href="/artwork" aria-current="page">Search</a>
            <a href="/collections">Collections</a>
            <a href="/exhibitions">Now on View</a>
        </nav>

        <section class="artwork-workspace">
            <header class="workspace-header">
                <h2>Search Artwork</h2>
            </header>
            
            <div class="field-bar">
                <input 
                    id="visitor-artwork-search"
                    name="visitor-artwork-search"
                    type="text"
                    required           
                >
                <select
                    id="search-artwork-field"
                    name="search-artwork-field"
                    required
                >
                    <option value="" disable selected>Select field...</option>
                    <option value="title">Title</option>
                    <option value="artist">Artist</option>
                </select>
                <button 
                    type="button"
                    id="search-artwork-button"
                >
                    Search
                </button>
            </div> 
            
            <p id="search-empty-state" hidden>
                No artwork pieces match your search.
            </p>

            <div id="artwork-results">
                
            </div>
        </section>

        

    </main>
    <footer>
        <a class="header-auth" href="/auth-staff">Staff Portal</a>
    </footer>
    <script src="js/artwork.js"></script>
</body>
</html>
