<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>MFAH Portal</title>
    <link rel="stylesheet" href="/style">
</head>
<body>
    <header class="site-header">
        <h1 class="site-title">MFAH System</h1>
        <nav>
            <a href="/artwork">Artwork</a>
            <a href="/collections">Collections</a>
            <a href="/exhibits">Exhibits</a>
            <a href="/personnel">Personnel</a>
            <a href="/ticketing">Ticketing</a>
            <a href="/logout">About</a>
        </nav>
        <hr>
    </header>
    <main>
        <h2>Artwork</h2>
        <div class="formcontainer">
            <form id="add-object-form">
                <h3>Add Object</h3>
                <div class="field-row">
                    <p>
                        <label for="title">Object Title</label><br>
                        <input id="title" name ="title" type="text" required>
                    </p>
                    <p>
                        <label for="producer">Producer</label><br>
                        <input id="producer" name="producer" type="text" required>
                    </p>                    
                </div>
                <div class="field-row">
                    <p>
                        <label for="placeOfProduction">Place of Production</label><br>
                        <input 
                            id="placeOfProduction" 
                            name="placeOfProduction"
                            type="text"
                            required
                        >
                    </p>
                    <p>
                        <label for="dateOfProduction">Date of Production</label><br>
                        <input 
                            id="dateOfProduction"
                            name="dateOfProduction"
                            type="text"
                            placeholder="YYYY"
                            pattern="[0-9]"
                            maxlength="4"
                        >
                    </p>
                </div>
            </form>
        </div>
        <p id="add-object-message" role="status"></p>
        <div class="formcontainer">
            <form id="add-artist-form">
                <h3>Add Artist</h3>
            </form>
        </div>
    </main>
    <script src="js/artwork.js"></script>
</body>
</html>
