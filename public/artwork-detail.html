<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>Artwork Detail - Visitor</title>
    <link rel="stylesheet" href="/style">
</head>
<body>
    <header class="site-header">
        <h1 class="site-title"><a href="/">MFAH</a></h1>
        <nav class="header-nav" aria-label="Main navigation">
            <a href="/artwork" aria-current="page">Artwork</a>
            <a href="/membership">Membership</a>
            <!-- <a href="/events">Events</a> -->
            <a href="/ticketing">Tickets</a>
            <a href="/shop">Shop</a>
        </nav>
    
        <!-- VISITOR_AUTH -->

    </header>

    <main>
        <nav aria-label="Artwork navigation">
            <a href="/artwork" aria-current="page">Search</a>
            <a href="/collections">Collections</a>
            <a href="/exhibitions">Now on View</a>
        </nav>

        <section class="artwork-detail-workspace">
        <a href="/artwork">
            ← Back to Artwork
        </a>
            <header class="workspace-header">
                <h2 id="artwork-name">Loading...</h2>
            </header>
        <div class="artwork-detail-content">
            <dl class="artwork-detail-grid">
                <dt>Title</dt>
                <dd id="artworkName"></dd>

                <dt>Artist</dt>
                <dd id="artist"></dd>

                <dt>Creation Date</dt>
                <dd id="creationDate"></dd>

                <dt>Category</dt>
                <dd id="category"></dd>

                <dt>Medium</dt>
                <dd id="medium"></dd>

                <dt>Dimensions</dt>
                <dd id="dimensions"></dd>

                <dt>Collection</dt>
                <dd id="collection"></dd>
            
            </dl>

            <img id="artwork-image" alt="" hidden>
        </div>

            


            
            <div id="detail-error" hidden>
                Unable to load artwork.
            </div>
        </section>
        
    </main>
    <script src="/js/artwork-detail.js"></script>
</body>
</html>
