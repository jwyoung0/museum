<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>MFAH Portal</title>
    <link rel="stylesheet" href="/style">
    <style>
        .login-message {
            display: none;

            margin-bottom: 16px;
            padding: 14px 16px;

            background: #fff7ed;
            border-left: 4px solid #ea580c;
            border-radius: 6px;

            color: #9a3412;
            font-size: 0.95rem;
            font-weight: 500;

            line-height: 1.4;
        }

        .login-message.visible {
            display: block;
        }
    </style>
</head>
<body class="login-page">
    <header class="site-header">
    <h1 class="site-title"><a href="/">MFAH</a></h1>
        
    
    <!-- place linke to previous page here -->
    
    
        <hr>
    </header>
    <main> 
        <div class="formcontainer">            
            <form id="login-form">
                <h2>Staff Portal Login</h2>

                <div 
                    id="login-message" 
                    class="login-message"
                    role="alert"
                ></div>

                <div class="field-row">
                    <label for="email">Email</label>
                    <input 
                        id="email"
                        name="email"
                        type="text"
                        placeholder="Enter email"
                        required    
                    >
                </div>
                <div class="field-row">
                    <label for="password">Password</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Enter password"
                        required
                    >
                </div>
                <button type="submit">Login</button>
            </form>
        </div>
    </main>
    <script src="js/login.js"></script>
</body>
</html>
