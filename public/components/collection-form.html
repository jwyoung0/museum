<section class="formcontainer artist-form-container" aria-labelledby="collection-form-title">
    <form
        id="collection-form"
        data-mode="create"
        data-collection-id=""
        action="/api/curator/collections"
        method="post"
    >
        <h2 id="collection-form-title">Create Collection</h2>

        <div class="field-row">
            <label for="collectionName">Name *</label>
            <input
                id="collectionName"
                name="collectionName"
                type="text"
                maxlength="50"
                required
            >
        </div>

        <div class="field-row">
            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                maxlength="250"
                rows="4"
            ></textarea>
        </div>

        <div class="form-actions">
            <button id="collection-submit-button" type="submit">
                Create Collection
            </button>
            <button id="collection-cancel-button" type="button">
                Cancel
            </button>
        </div>
    </form>
</section>
