<section class="formcontainer artist-form-container" aria-labelledby="exhibition-form-title">
    <form
        id="exhibition-form"
        data-mode="create"
        data-exhibition-id=""
        action="/api/curator/exhibitions"
        method="post"
    >
        <h2 id="exhibition-form-title">Create Exhibition</h2>

        <div class="field-row">
            <label for="exhibitionName">Name *</label>
            <input
                id="exhibitionName"
                name="exhibitionName"
                type="text"
                maxlength="50"
                required
            >
        </div>

        <div class="field-row">
            <label for="startDate">Start Date</label>
            <input
                id="startDate"
                name="startDate"
                type="date"
                required
            >
        </div>

        <div class="field-row">
            <label for="endDate">End Date</label>
            <input
                id="endDate"
                name="endDate"
                type="date"
                required
            >
        </div>

        <div class="field-row">
            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                maxlength="500"
                rows="4"
            ></textarea>
        </div>

        <div class="form-actions">
            <button id="exhibition-submit-button" type="submit">
                Create Exhibition
            </button>
            <button id="exhibition-cancel-button" type="button">
                Cancel
            </button>
        </div>
    </form>
