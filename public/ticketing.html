<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MFAH Tickets</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 30px 15px;
    background: #f1f2f5;
    font: 16px Arial, sans-serif;
}

main {
    max-width: 680px;
    margin: auto;
    padding: 30px;
    background: #5c6578;
    color: white;
}

h1 { font-size: 30px; margin: 20px 0 30px; }
h2 { font-size: 21px; margin-top: 30px; }
a { color: white; }

.ticket {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    margin: 10px 0;
    background: white;
    color: #263047;
}

.price { width: 65px; }
.name { flex: 1; }

.controls {
    display: flex;
    align-items: center;
    gap: 12px;
}

.controls button {
    background: #5c6578;
    color: white;
    border: 0;
    padding: 8px 12px;
    cursor: pointer;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0 18px;
    border: 1px solid #ccc;
    font: inherit;
}

label { display: block; margin-top: 15px; }

.action, .login {
    display: block;
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border: none;
    background: #177900;
    color: white;
    font: inherit;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
}

.secondary, .login {
    background: #e5e7eb;
    color: #263047;
}

button:disabled { opacity: .5; cursor: not-allowed; }

.summary {
    border-top: 2px solid white;
    padding-top: 20px;
    margin-top: 30px;
    white-space: pre-line;
    line-height: 1.8;
}

#message { white-space: pre-line; line-height: 1.7; }
[hidden] { display: none !important; }

@media (max-width: 550px) {
    main { padding: 18px; }
    .ticket { flex-wrap: wrap; }
}
.site-header {
    background: white;
    padding: 20px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.site-header a {
    color: #263047;
    margin-right: 12px;
}

</style>
</head>
<body>
  <header class="site-header">
    <a href="/">MFAH</a>
    <nav>
        <a href="/artwork">Artwork</a>
        <a href="/membership">Membership</a>
        <!-- <a href="/events">Events</a> -->
        <a href="/ticketing">Tickets</a>
        <a href="/shop">Shop</a>
    </nav>
    <!-- VISITOR_AUTH -->
</header>
<main>
<a href="/">✕ Exit Ticketing</a>
<h1>Museum Admission</h1>

<p id="membership">Membership: Checking...</p>

<section id="choose">
    <h2>Select Tickets</h2>

    <label for="visitDate">Date of Visit</label>
    <input type="date" id="visitDate" required>

    <div id="ticketTypes">Loading tickets...</div>

    <div class="summary">
        Total: <strong id="total">$0.00</strong>
    </div>

    <button class="action" id="next" disabled>Next</button>
</section>

<section id="account" hidden>
    <h2>Log In for Account Access</h2>
    <p>Already have an account?</p>

    <a class="login" href="/auth-visitor" id="ticketLogin">Log In</a>
    <button class="action" id="skip">Skip for Now</button>
    <button class="action secondary" onclick="show('choose')">Back</button>
</section>

<section id="review" hidden>
    <h2>Review Your Tickets</h2>

    <div class="summary" id="summary"></div>
    <div id="freeOption" hidden>
    <label>
        <span id="freeLabel">Free Guest Tickets Available:</span>
        <span id="freeCount">0</span>
    </label>
    <label for="freeTickets">How many do you want to use?</label>
    <input type="number" id="freeTickets" min="0" value="0">
</div>

    <form id="form">
        <label for="name">Full Name</label>
        <input id="name" maxlength="100" required>

        <label for="email">Email Address</label>
        <input id="email" type="email" maxlength="150" required>

        <button class="action" id="buy" type="submit">
            Confirm Purchase
        </button>
    </form>

    <button class="action secondary" onclick="show('choose')">Back</button>
</section>

<p id="message" role="status"></p>
</main>

<script>
const $ = id => document.getElementById(id);
let types = [];
let quantities = {};
let signedIn = false;
$("ticketLogin").onclick = () => {
    sessionStorage.setItem("ticketDraft", JSON.stringify({
        quantities,
        visitDate: $("visitDate").value
    }));
};

const age = {
    Adult: "Adult (19+)",
    Student: "Student (Valid ID)",
    Senior: "Senior (65+)",
    Youth: "Youth (13–18)",
    Child: "Child (12 & Under)"
};

const money = n => Number(n) === 0
    ? "FREE" : "$" + Number(n).toFixed(2);

const count = () => Object.values(quantities)
    .reduce((sum, n) => sum + n, 0);

const total = () => types.reduce((sum, t) =>
    sum + Number(t.Price) * (quantities[t.TicketTypeID] || 0), 0);

const now = new Date();
const today = new Date(now - now.getTimezoneOffset() * 60000)
    .toISOString().slice(0, 10);

$("visitDate").min = today;
$("visitDate").value = today;

const draft = JSON.parse(sessionStorage.getItem("ticketDraft") || "null");

if (draft) {
    quantities = draft.quantities;
    $("visitDate").value = draft.visitDate;
    sessionStorage.removeItem("ticketDraft");
}


function show(page) {
    ["choose", "account", "review"].forEach(id =>
        $(id).hidden = id !== page
    );
    $("message").textContent = "";
}

function update() {
    types.forEach(t => {
        $("qty-" + t.TicketTypeID).textContent =
            quantities[t.TicketTypeID] || 0;
    });

    $("total").textContent = "$" + total().toFixed(2);
    $("next").disabled = count() === 0 || !$("visitDate").value;
}

// Load ticket prices from SQL Server
async function loadTickets() {
    try {
        const res = await fetch("/api/ticket-types");
        if (!res.ok) throw Error("Unable to load tickets");

        types = await res.json();
        if (!types.length) throw Error("No tickets available");

        $("ticketTypes").innerHTML = "";

        types.forEach(t => {
            const row = document.createElement("div");
            row.className = "ticket";

            const price = document.createElement("strong");
            price.className = "price";
            price.textContent = money(t.Price);

            const name = document.createElement("span");
            name.className = "name";
            name.textContent = age[t.TicketTypeName] || t.TicketTypeName;

            const controls = document.createElement("div");
            controls.className = "controls";

            const minus = document.createElement("button");
            minus.textContent = "−";

            const qty = document.createElement("span");
            qty.id = "qty-" + t.TicketTypeID;
            qty.textContent = "0";

            const plus = document.createElement("button");
            plus.textContent = "+";

            minus.onclick = () => change(t.TicketTypeID, -1);
            plus.onclick = () => change(t.TicketTypeID, 1);

            controls.append(minus, qty, plus);
            row.append(price, name, controls);
            $("ticketTypes").appendChild(row);
        });

        update();
    } catch (error) {
        $("ticketTypes").textContent = error.message;
    }
}

function change(id, amount) {
    const current = quantities[id] || 0;
    const next = current + amount;

    if (next < 0 || next > 10) return;
    if (amount > 0 && count() >= 10) return;

    quantities[id] = next;
    update();
}

$("visitDate").onchange = update;

$("next").onclick = () => {
    if (!$("visitDate").reportValidity() || !count()) return;

    if (signedIn) {
        $("skip").click();
    } else {
        show("account");
    }
};

// Review tickets
$("skip").onclick = () => {
    const tickets = types.filter(t => quantities[t.TicketTypeID])
        .map(t =>
            `${quantities[t.TicketTypeID]} x ` +
            `${age[t.TicketTypeName] || t.TicketTypeName} - ` +
            `${money(Number(t.Price) * quantities[t.TicketTypeID])}`
        );

    $("summary").textContent =
        `Visit Date: ${$("visitDate").value}\n\n` +
        tickets.join("\n") +
        `\n\nTotal: $${total().toFixed(2)}`;

    $("freeTickets").max = Math.min(
        Number($("freeCount").textContent), count()
    );
    show("review");
    $("freeTickets").oninput();
};
$("freeTickets").oninput = () => {
    const prices = types.flatMap(t =>
        Array(quantities[t.TicketTypeID] || 0).fill(Number(t.Price))
    ).filter(p => p > 0);

    const n = Math.min(Number($("freeTickets").value) || 0, prices.length);
    const discount = prices.slice(0, n).reduce((a, b) => a + b, 0);

    $("summary").textContent = $("summary").textContent.replace(
        /Total: \$[\d.]+$/,
        `Total: $${(total() - discount).toFixed(2)}`
    );
};

// Confirm purchase
$("form").onsubmit = async e => {
    e.preventDefault();

    const ids = types.flatMap(t =>
        Array(quantities[t.TicketTypeID] || 0).fill(t.TicketTypeID)
    );

    const freeAmount = Number($("freeTickets").value);
    const paidCount = ids.filter(id =>
        Number(types.find(t => t.TicketTypeID === id)?.Price) > 0
    ).length;

    if (!Number.isInteger(freeAmount) ||
        freeAmount < 0 ||
        freeAmount > Math.min(Number($("freeCount").textContent), paidCount)) {
        $("message").textContent = "Invalid free ticket quantity";
        return;
    }
    $("buy").disabled = true;
    $("buy").textContent = "Saving...";

    const saved = [];
    let freeLeft = Number($("freeTickets").value) || 0;

    try {
        for (const ticketTypeId of ids) {
            const useFreeTicket = freeLeft > 0 &&
                Number(types.find(t => t.TicketTypeID === ticketTypeId)?.Price) > 0;
            const res = await fetch("/api/tickets", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: $("name").value.trim(),
                    email: $("email").value.trim(),
                    ticketTypeId,
                    visitDate: $("visitDate").value,
                    useFreeTicket
                })
            });

            const result = await res.json();
            if (!res.ok) throw Error(result.error || "Purchase failed");

            saved.push(result);
            if (useFreeTicket) freeLeft--;
        }

        $("message").textContent =
            `Tickets Purchased Successfully!\n` +
            `Visit Date: ${$("visitDate").value}\n` +
            `Ticket IDs: ${saved.map(t => t.TicketID).join(", ")}\n` +
            `Total: $${saved.reduce((sum, t) =>
                sum + Number(t.Price), 0).toFixed(2)}`;

        $("buy").textContent = "Purchase Complete";

    } catch (error) {
        $("message").textContent =
            `Purchase Incomplete\n` +
            `Saved Tickets: ${saved.length}\n` +
            `Ticket IDs: ${saved.map(t => t.TicketID).join(", ") || "None"}\n` +
            `Error: ${error.message}\n` +
            `Check My Tickets before trying again.`;

        $("buy").textContent = "Purchase Incomplete";
    }
};

async function start() {
    await loadTickets();

    try {
        const res = await fetch("/api/membership-status");
        if (!res.ok) throw Error("Membership unavailable");

        const member = await res.json();
        const remaining = member.unlimitedTickets
            ? 10 : Number(member.remainingTickets) || 0;

        $("freeCount").textContent = remaining;
        $("freeTickets").max = remaining;
        $("freeOption").hidden = remaining === 0;
        $("freeLabel").textContent = member.unlimitedTickets
            ? "Unlimited Guest Admission (max per order):"
            : "Free Guest Tickets Available:";

        signedIn = !!member.email;

        $("membership").textContent =
            "Membership: " + (member.tier || "None");

        if (signedIn) {
            $("email").value = member.email;
            $("email").readOnly = true;
        }

        if (draft && signedIn && count() && types.length) {
            $("skip").click();
        }
    } catch {
        $("membership").textContent = "Membership: Unable to check";
    }
}

start();
</script>
</body>
</html>
