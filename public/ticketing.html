
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MFAH - Purchase Tickets</title>
</head>
<body>

    <h1>Museum Ticket Purchase</h1>
    <p>Welcome to the Museum of Fine Arts Houston!</p>

    <h2>Buy Your Tickets</h2>

    <form id="ticketForm">

        <label for="name">Visitor Name:</label>
        <input type="text" id="name" required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" required>

        <br><br>


    <select id="ticketType" required>
        <option value="">Loading ticket types...</option>
    </select>


        <br><br>

        <button type="button">Purchase Ticket</button>

    </form>

<script>
async function loadTicketTypes() {
    const dropdown = document.getElementById("ticketType");

    try {
        const response = await fetch("/api/ticket-types");

        if (!response.ok) {
            throw new Error("Failed to load tickets");
        }

        const tickets = await response.json();

        dropdown.innerHTML = '<option value="">Select Ticket</option>';

        tickets.forEach(ticket => {
            const option = document.createElement("option");

            option.value = ticket.TicketTypeName;
            option.textContent = ticket.TicketTypeName;

            dropdown.appendChild(option);
        });

    } catch (error) {
        console.error(error);
        dropdown.innerHTML =
            '<option value="">Unable to load tickets</option>';
    }
}

loadTicketTypes();
</script>
</body>
</html>
