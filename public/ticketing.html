
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFAH - Purchase Tickets</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #193a60;
            text-align: center;
            margin-bottom: 10px;
        }

        h2 {
            color: #193a60;
            margin-top: 30px;
        }

        .subtitle {
            text-align: center;
            color: #666;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background: white;
        }

        .ticket-box {
            background: #f8f9fc;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .ticket-box h3 {
            color: #193a60;
            margin-top: 0;
        }

        .ticket-box select {
            margin-bottom: 0;
        }

        .total-box {
            background: #eef3f9;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-box h2 {
            margin: 0;
        }

        #totalPrice {
            font-size: 26px;
            font-weight: bold;
            color: #193a60;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #193a60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #28588a;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .note {
            font-size: 13px;
            color: #777;
            margin-top: 15px;
        }

        #confirmation {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #eef3f9;
            white-space: pre-line;
        }

        #confirmation:empty {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <a href="/">← Back to Home</a>

        <h1>Museum Ticket Purchase</h1>

        <p class="subtitle">
            Welcome to the Museum of Fine Arts Houston!
        </p>

        <form id="ticketForm">

            <!-- VISITOR INFORMATION -->

            <h2>Visitor Information</h2>

            <label for="name">Full Name:</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email Address:</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <!-- NUMBER OF TICKETS -->

            <h2>Select Your Tickets</h2>

            <label for="ticketQuantity">
                How many tickets would you like?
            </label>

            <select id="ticketQuantity" required>
                <option value="1">1 Ticket</option>
                <option value="2">2 Tickets</option>
                <option value="3">3 Tickets</option>
                <option value="4">4 Tickets</option>
                <option value="5">5 Tickets</option>
                <option value="6">6 Tickets</option>
                <option value="7">7 Tickets</option>
                <option value="8">8 Tickets</option>
                <option value="9">9 Tickets</option>
                <option value="10">10 Tickets</option>
            </select>


            <!-- DYNAMIC TICKET DROPDOWNS -->

            <div id="ticketSelections"></div>


            <!-- TOTAL PRICE -->

            <div class="total-box">
                <h2>Total:</h2>
                <span id="totalPrice">$0.00</span>
            </div>

            <p class="note">
                Students must present a valid student ID.
                Children 12 and under receive free admission.
            </p>


            <!-- PURCHASE BUTTON -->

            <button type="submit" id="purchaseButton" disabled>
                Loading Ticket Types...
            </button>

        </form>

        <div id="confirmation" role="status" aria-live="polite"></div>

    </div>


    <script>

        // TICKET DATA FROM AZURE SQL

        let ticketTypes = [];

        const quantityDropdown =
            document.getElementById("ticketQuantity");

        const ticketSelections =
            document.getElementById("ticketSelections");

        const totalPrice =
            document.getElementById("totalPrice");

        const purchaseButton =
            document.getElementById("purchaseButton");

        const confirmation =
            document.getElementById("confirmation");


        // LOAD TICKET TYPES

        async function loadTicketTypes() {
            try {
                const response = await fetch("/api/ticket-types");

                if (!response.ok) {
                    throw new Error("Unable to load ticket types");
                }

                ticketTypes = await response.json();

                if (ticketTypes.length === 0) {
                    throw new Error("No ticket types available");
                }

                createTicketDropdowns();

                purchaseButton.disabled = false;
                purchaseButton.textContent = "Purchase Tickets";

            } catch (error) {
                console.error(error);

                purchaseButton.disabled = true;
                purchaseButton.textContent =
                    "Tickets Unavailable";

                confirmation.textContent = error.message;
            }
        }


        // CREATE TICKET DROPDOWNS

        function createTicketDropdowns() {
            const quantity = Number(quantityDropdown.value);

            const previousSelections = Array.from(
                ticketSelections.querySelectorAll(".ticketType")
            ).map(select => select.value);

            ticketSelections.innerHTML = "";

            for (let i = 0; i < quantity; i++) {

                const ticketBox = document.createElement("div");
                ticketBox.className = "ticket-box";

                const heading = document.createElement("h3");
                heading.textContent = `Ticket ${i + 1}`;

                const label = document.createElement("label");
                label.textContent = "Choose Ticket Type:";

                const dropdown = document.createElement("select");
                dropdown.className = "ticketType";
                dropdown.required = true;

                const placeholder = document.createElement("option");
                placeholder.value = "";
                placeholder.textContent = "Select Ticket Type";

                dropdown.appendChild(placeholder);

                ticketTypes.forEach(ticket => {

                    const option = document.createElement("option");

                    option.value = ticket.TicketTypeID;

                    let labelText = ticket.TicketTypeName;

                    if (ticket.TicketTypeName === "Student") {
                        labelText = "Student (Valid Student ID)";
                    }

                    if (ticket.TicketTypeName === "Child") {
                        labelText = "Child (12 & Under)";
                    }

                    const price = Number(ticket.Price);

                    const priceText = price === 0
                        ? "FREE"
                        : `$${price.toFixed(2)}`;

                    option.textContent =
                        `${labelText} - ${priceText}`;

                    dropdown.appendChild(option);
                });

                dropdown.value = previousSelections[i] || "";

                dropdown.addEventListener(
                    "change",
                    calculateTotal
                );

                ticketBox.appendChild(heading);
                ticketBox.appendChild(label);
                ticketBox.appendChild(dropdown);

                ticketSelections.appendChild(ticketBox);
            }

            calculateTotal();
        }


        // CALCULATE TOTAL PRICE

        function calculateTotal() {
            let total = 0;

            const dropdowns =
                document.querySelectorAll(".ticketType");

            dropdowns.forEach(dropdown => {

                const selectedTicket = ticketTypes.find(
                    ticket =>
                        String(ticket.TicketTypeID) === dropdown.value
                );

                if (selectedTicket) {
                    total += Number(selectedTicket.Price);
                }
            });

            totalPrice.textContent = "$" + total.toFixed(2);
        }


        // CHANGE NUMBER OF TICKETS

        quantityDropdown.addEventListener(
            "change",
            createTicketDropdowns
        );


        // PURCHASE TICKETS

        document.getElementById("ticketForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const name =
                    document.getElementById("name").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const dropdowns =
                    document.querySelectorAll(".ticketType");

                const selectedTickets =
                    Array.from(dropdowns).map(dropdown =>
                        Number(dropdown.value)
                    );

                if (selectedTickets.some(id => !id)) {
                    alert("Please select every ticket type.");
                    return;
                }

                purchaseButton.disabled = true;
                purchaseButton.textContent = "Processing Tickets...";

                confirmation.textContent = "";

                const purchasedTickets = [];
                let purchaseError = null;

                // The current backend saves one ticket per request.

                for (const ticketTypeId of selectedTickets) {

                    try {
                        const response = await fetch("/api/tickets", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                name,
                                email,
                                ticketTypeId
                            })
                        });

                        const result = await response.json();

                        if (!response.ok) {
                            throw new Error(
                                result.error || "Purchase failed"
                            );
                        }

                        purchasedTickets.push(result);

                    } catch (error) {
                        purchaseError = error;
                        console.error(error);
                        break;
                    }
                }

                // SHOW PURCHASE CONFIRMATION

                if (!purchaseError) {

                    const total = purchasedTickets.reduce(
                        (sum, ticket) =>
                            sum + Number(ticket.Price),
                        0
                    );

                    const ticketIds = purchasedTickets.map(
                        ticket => ticket.TicketID
                    ).join(", ");

                    confirmation.textContent =
                        "Tickets Purchased Successfully!\n" +
                        "Tickets: " + purchasedTickets.length + "\n" +
                        "Ticket IDs: " + ticketIds + "\n" +
                        "Total: $" + total.toFixed(2);

                    purchaseButton.textContent = "Purchase Complete";

                } else {

                    const savedIds = purchasedTickets.map(
                        ticket => ticket.TicketID
                    ).join(", ");

                    confirmation.textContent =
                        "Purchase was not fully completed.\n" +
                        "Confirmed tickets: " +
                        purchasedTickets.length + "\n" +
                        "Saved Ticket IDs: " +
                        (savedIds || "None") + "\n" +
                        "Error: " + purchaseError.message + "\n" +
                        "Please check saved tickets before trying again.";

                    purchaseButton.textContent = "Purchase Incomplete";
                }

            });


        loadTicketTypes();

    </script>

</body>
</html>
