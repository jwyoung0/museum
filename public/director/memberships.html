<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Museum Director Dashboard - Memberships</title>
    <link rel="stylesheet" href="/style">
    <script src="/js/director-memberships.js" defer></script>
</head>
<body>
    <header class="dashboard-header">
        <h1 class="site-title"><a href="/">MFAH</a></h1>
        <h1 class="dashboard-title">Museum Director Dashboard</h1>
        <form class="header-auth-form" action="/api/logout" method="post">
            <button type="submit" class="header-auth">Logout</button>
        </form>
    </header>

    <main>
        <nav aria-label="Director sections">
            <button type="button" data-tab="personnel">Personnel</button>
            <a href="/director/memberships" data-tab="memberships" aria-current="page">Memberships</a>
            <button type="button" data-tab="events">Events</button>
            <button type="button" disabled>Ticket Revenue — Coming Soon</button>
        </nav>

        <section class="artists-workspace" aria-labelledby="memberships-heading">
            <header class="workspace-header">
                <h2 id="memberships-heading">Membership Tiers</h2>
            </header>

            <div class="workspace-toolbar">
                <input
                    type="search"
                    id="tier-search"
                    placeholder="Search membership tiers..."
                    aria-label="Search membership tiers"
                >
                <p id="memberships-message" role="status" aria-live="polite">
                    Loading membership tiers...
                </p>
            </div>

            <div class="artists-table-container">
                <table class="artists-table">
                    <thead>
                        <tr>
                            <th scope="col">Tier Name</th>
                            <th scope="col">Price</th>
                            <th scope="col">Discount</th>
                            <th scope="col">VIP Access</th>
                            <th scope="col">Benefits</th>
                        </tr>
                    </thead>
                    <tbody id="memberships-table-body">
                        <tr id="loading-state">
                            <td colspan="5">Loading membership tiers...</td>
                        </tr>
                        <tr id="empty-state" hidden>
                            <td colspan="5">No membership tiers match your search.</td>
                        </tr>
                        <tr id="error-state" hidden>
                            <td colspan="5">Unable to load membership tiers.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
