<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>Curator Dashboard</title>
    <link rel="stylesheet" href="/style">
</head>
<body>
    <header class="dashboard-header">
        <h1 class="site-title"><a href="/">MFAH</a></h1>
        <h1 class="dashboard-title">Curator Dashboard</h1>
        <a class="header-auth" href="/logout">Logout</a>
    </header>

    <main>
        <nav aria-label="Curator navigation">
            <a href="/curator/artwork">Artwork</a>
            <a href="/curator/artists" aria-current="page">Artists</a>
            <a href="/curator/collections">Collections</a>
            <a href="/curator/exhibitions">Exhibits</a>
        </nav>

        <section class="artists-workspace">
            <header class="workspace-header">
                <h2>Artists</h2>
            </header>

            <div class="workspace-toolbar">
                <input
                    type="search"
                    id="artist-search"
                    placeholder="Search artists..."
                    aria-label="Search artists"
                >

                <button
                    type="button"
                    id="add-artist-button"
                >
                    + Add Artist    
                </button>
            </div>

            <div class="artists-table-container">
                <table class="artists-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Lifespan</th>
                            <th>Nationality</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="artists-table-body">
                        <div id="search-empty-state" hidden>
                            No artists match your search.
                        </div>
                        
                        <div id="error-state" hidden>
                            Unable to load artists.
                        </div>
                    
                    </tbody>
                </table>
            </div>

        </section>
