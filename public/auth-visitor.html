<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>MFAH Portal</title>
    <link rel="stylesheet" href="/style">
</head>
<body class="login-page">
    <header class="site-header">
    <h1 class="site-title"><a href="/">MFAH</a></h1>
        
    
    <!-- place linke to previous page here -->
    
    
        <hr>
    </header>
    <main> 
        <div class="formcontainer">            
            <form id="login-form">
                <h2>Sign In</h2>
                <p>Sign in with the email address you used to register or join.</p>
                <div class="field-row">
                    <label for="email">Email</label>
                    <input 
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="Enter email address"
                        required    
                    >
                </div>
                <div class="field-row">
                    <label for="password">Password</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >
                </div>
                <button type="submit">Sign In</button>
                <div class="registration-links">
                    <p>Not registered?</p>
                    <a href="/auth-create-account">Create an account</a>
                </div>                
            </form>
        </div>
        <p id="login-message" role="status"></p>
    </main>
    <script src="js/auth-visitor.js"></script>
</body>
</html>
