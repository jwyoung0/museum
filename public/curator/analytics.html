<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>Curator Dashboard</title>
    <link rel="stylesheet" href="/style">
    <style>
        .analytics-workspace {
            width: 100%;
            margin: 20px 0;
            padding: 24px;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .analytics-filters {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .analytics-table {
            width: 100%;
            border-collapse: collapse;
        }

        .analytics-table th,
        .analytics-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--line);
            text-align: left;
        }

        .analytics-table thead {
            background: var(--bg);
        }
    </style>
</head>
<body>
    <header class="dashboard-header">
        <h1 class="site-title"><a href="/">MFAH</a></h1>
        <h1 class="dashboard-title">Curator Dashboard</h1>
        <form class="header-auth-form" action="/api/logout" method="post">
            <button type="submit" class="header-auth">Logout</button>
        </form>
    </header>

    <main>
        <nav aria-label="Curator navigation">
            <a href="/curator/artwork">Artwork</a>
            <a href="/curator/artists">Artists</a>
            <a href="/curator/collections">Collections</a>
            <a href="/curator/exhibitions">Exhibitions</a>
            <a href="/curator/analytics" aria-current="page">Analytics</a>
        </nav>

        <section class="analytics-workspace">
            <header class="workspace-header">
                <h2>Curator Analytics</h2>
            </header>

            <div class="analytics-filters">

                <div class="field-row">
                    <label for="report-type">Report</label>
                    <select id="report-type">
                        <option value="artists">Most Viewed Artists</option>
                        <option value="artworks">Most Viewed Artworks</option>
                        <option value="styles">Most Viewed Styles</option>
                        <option value="periods">Most Viewed Periods</option>
                        <option value="collections">Most Viewed Collections</option>
                        <option value="monthly-engagement">Monthly Engagement</option>
                    </select>
                </div>

                <div class="field-row">
                    <label for="start-date">Start Date</label>
                    <input type="date" id="start-date">
                </div>

                <div class="field-row">
                    <label for="end-date">End Date</label>
                    <input type="date" id="end-date">
                </div>

                <div class="field-row">
                    <label for="tier">Membership Tier</label>
                    <select id="tier">
                        <option value="">All Membership Tiers</option>
                    </select>
                </div>

                <button id="run-report-btn">
                    Run Report
                </button>

            </div>

            <div id="report-results">
                <table class="analytics-table">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>        
    </main>
    <script type="module" src="/js/curator-analytics.js"></script>
</body>
</html>
