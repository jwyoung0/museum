<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>Curator Dashboard</title>
    <link rel="stylesheet" href="/style">
    <style>
        .analytics-filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            padding: 20px;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 8px;
            margin-bottom: 24px;
            align-items: end;
        }

        .analytics-filters .field-row,
        .analytics-filters .entity-value {
            margin-bottom: 0;
        }

        .analytics-filters label {
            font-weight: 600;
            color: var(--ink);
        }

        #run-report-btn {
            height: 40px;
            white-space: nowrap;
            align-self: end;
        }
</style>
</head>
<body>
    <header class="dashboard-header">
        <h1 class="site-title"><a href="/">MFAH</a></h1>
        <h1 class="dashboard-title">Curator Dashboard</h1>
        <form class="header-auth-form" action="/api/logout" method="post">
            <button type="submit" class="header-auth">Logout</button>
        </form>
    </header>

    <main>
        <nav aria-label="Curator navigation">
            <a href="/curator/artwork">Artwork</a>
            <a href="/curator/artists">Artists</a>
            <a href="/curator/collections">Collections</a>
            <a href="/curator/exhibitions">Exhibitions</a>
            <a href="/curator/analytics" aria-current="page">Analytics</a>
        </nav>

        <section class="analytics-workspace">
            <header class="workspace-header">
                <h2>Curator Analytics</h2>
            </header>

            <div id="analytics-chart"></div>

            <div class="analytics-filters">

                <div class="field-row">
                    <label for="visualization">Visualization</label>
                    <select id="visualization">
                        <option value="trend">Trend</option>
                        <option value="ranking">Ranking</option>
                    </select>
                </div>

                <div class="field-row">
                    <label for="analyze-by">Analyze By</label>
                    <select id="analyze-by">
                        <option value="artists">Artists</option>
                        <option value="artist-sex">Artist's Sex</option>
                        <option value="artworks">Artworks</option>
                        <option value="styles">Styles</option>
                        <option value="periods">Periods</option>
                        <option value="collections">Collections</option>
                        <option value="exhibitions">Exhibitions</option>
                    </select>
                </div>

                <div class="entity-value">
                    <label for="entity-value">Value</label>
                    <select id="entity-value">
                    </select>
                </div>

                <div class="field-row">
                    <label for="start-date">Start Date</label>
                    <input type="date" id="start-date">
                </div>

                <div class="field-row">
                    <label for="end-date">End Date</label>
                    <input type="date" id="end-date">
                </div>

                <div class="field-row">
                    <label for="tier">Membership Tier</label>
                    <select id="tier">
                        <option value="">All Membership Tiers</option>
                    </select>
                </div>

                <button id="run-report-btn">
                    Run Report
                </button>

            </div>

            <div id="report-results">
                <table class="analytics-table">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>        
    </main>
    <script type="module" src="/js/curator-analytics.js"></script>
</body>
</html>
