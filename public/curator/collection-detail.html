<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>Collection Details | Curator Dashboard</title>
    <link rel="stylesheet" href="/style">
    <style>
        /* Curator collection detail */

        .collection-detail-workspace {
            width: 100%;
            max-width: 1060px;
            margin: 0 auto;
        }

        .collection-artworks {
            margin-top: 2rem;
            padding: 1.5rem;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .collection-artworks h3 {
            margin-top: 0;
            margin-bottom: 1rem;
        }

        .collection-artworks table {
            width: 100%;
            border-collapse: collapse;
        }

        .collection-artworks th {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 2px solid var(--line);
            background: var(--bg);
        }

        .collection-artworks td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--line);
        }

        .collection-artworks tbody tr:hover {
            background: rgba(37, 99, 235, 0.04);
        }

        #empty-artworks {
            padding: 1rem;
            text-align: center;
            color: var(--muted);
        }

        .artist-actions {
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <header class="dashboard-header">
        <h1 class="site-title"><a href="/">MFAH</a></h1>
        <h1 class="dashboard-title">Curator Dashboard</h1>
        <form class="header-auth-form" action="/api/logout" method="post">
            <button type="submit" class="header-auth">Logout</button>
        </form>
    </header>

    <main>
        <nav aria-label="Curator navigation">
            <a href="/curator/artwork">Artwork</a>
            <a href="/curator/artists">Artists</a>
            <a href="/curator/collections" aria-current="page">Collections</a>
            <a href="/curator/exhibitions">Exhibitions</a>
            <a href="/curator/analytics">Analytics</a>
        </nav>

        <section class="artist-detail-workspace">
            <a href="/curator/collections">← Back to Collections</a>
            <header class="workspace-header">
                <h2 id="collection-name">Loading...</h2>
            </header>

            <dl class="artist-detail-grid">
                <dt>Name</dt>
                <dd id="collectionName"></dd>

                <dt>Description</dt>
                <dd id="description"></dd>

                <dt>Artwork Count</dt>
                <dd id="artwork-count"></dd>
            </dl>

            <div class="artist-actions">
                <button
                    id="delete-collection-button"
                    class="button-danger"
                    type="button"
                    hidden
                >
                    Delete Collection
                </button>
            </div>

            <div id="detail-error" role="alert" hidden>
                Unable to load collection.
            </div>            
        </section>
        <section class="collection-artworks">
            <h3>Artworks</h3>

            <table class="workspace-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Artist</th>
                        <th>Year</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="artworks-table-body">
                </tbody>
            </table>

            <div id="error-state" role="alert" hidden>
                Unable to load artworks in collection.
            </div>  

            <div id="empty-artworks" hidden>
                No artworks are assigned to this collection.
            </div>
        </section>
    </main>
    <script src="/js/curator-collection-detail.js"></script>
</body>
</html>
