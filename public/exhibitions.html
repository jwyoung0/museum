<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>MFAH Portal</title>
    <link rel="stylesheet" href="/style">
</head>
<body>
    <header class="site-header">
        <h1 class="site-title"><a href="/">MFAH</a></h1>
        <nav class="header-nav" aria-label="Main navigation">
            <a href="/artwork" aria-current="page">Artwork</a>
            <a href="/membership">Membership</a>
            <a href="/events">Events</a>
            <a href="/ticketing">Tickets</a>
            <a href="/shop">Shop</a>
        </nav>
        
        <!-- VISITOR_AUTH -->
    
    </header>   
    <main>
        <nav aria-label="Artwork navigation">
            <a href="/artwork">Search</a>
            <a href="/collections">Collections</a>
            <a href="/exhibitions" aria-current="page">Now on View</a>
        </nav>

        <section class="exhibitions-workspace">
            <header class="workspace-header">
                <h2>Search Exhibitions</h2>
            </header>
            
            <div class="field-bar">
                <input 
                    id="visitor-exhibitions-search"
                    name="visitor-exhibitions-search"
                    type="text"
                    required           
                >
                <select
                    id="search-exhibitions-field"
                    name="search-exhibitions-field"
                    required
                >
                    <option value="" disable selected>Select field...</option>
                    <option value="current">Current</option>
                    <option value="upcoming">Upcoming</option>
                    <option value="past">Past</option>
                </select>
                <button 
                    type="button"
                    id="search-exhibitions-button"
                >
                    Search
                </button>
            </div> 
            
            <p id="search-empty-state" hidden>
                No exhibitions match your search.
            </p>

            <div id="exhibitions-results">
                
            </div>
        </section>


    </main>
    <footer>
        <a class="header-auth" href="/auth-staff">Staff Portal</a>
    </footer>    
    <script src="js/exhibitions.js"></script>
</body>
</html>
